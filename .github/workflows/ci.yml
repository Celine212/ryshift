name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch Pdfium
        shell: bash
        run: scripts/fetch-pdfium.sh

      - name: Engine tests
        run: cargo test -p shiftwheel-engine

      - name: App unit tests
        run: cargo test -p shiftwheel-app

      - name: Build CLI and app
        run: cargo build -p shiftwheel-cli -p shiftwheel-app
