name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch Pdfium
        shell: bash
        run: scripts/fetch-pdfium.sh

      - name: Engine tests
        run: cargo test -p ryshift-engine

      - name: App unit tests
        run: cargo test -p ryshift-app

      - name: Build CLI and app
        run: cargo build -p ryshift-cli -p ryshift-app

  gnome-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          cp gnome-extension/ryshift@alexriderspy.github.io/extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs

      - name: Pack
        run: |
          sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip
          scripts/pack-gnome-extension.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ryshift-gnome-extension
          path: dist/*.shell-extension.zip
