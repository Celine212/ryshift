<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ryshift</title>
  <link rel="stylesheet" href="wheel.css" />
</head>
<body>
  <div id="root">
    <!-- Frosted stand-in for systems without native glass (Linux). On macOS
         and Windows the OS draws real glass behind this transparent window. -->
    <div id="disk"></div>
    <svg id="wheel" viewBox="0 0 320 320" width="320" height="320" aria-label="Ryshift">
      <defs>
        <!-- Specular rim: bright where light hits (top-left, bottom-right), thin elsewhere. -->
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.95" />
          <stop offset="0.3" stop-color="#fff" stop-opacity="0.18" />
          <stop offset="0.7" stop-color="#fff" stop-opacity="0.08" />
          <stop offset="1" stop-color="#fff" stop-opacity="0.7" />
        </linearGradient>
        <radialGradient id="sheen" cx="0.38" cy="0.18" r="0.75">
          <stop offset="0" stop-color="#fff" stop-opacity="0.32" />
          <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle id="sheen-disk" cx="160" cy="160" r="150" fill="url(#sheen)"></circle>
      <g id="slices"></g>
      <circle id="hub" cx="160" cy="160" r="44"></circle>
      <circle class="rim" cx="160" cy="160" r="44"></circle>
      <circle class="rim" cx="160" cy="160" r="149.25"></circle>
      <text id="hub-top" x="160" y="156" text-anchor="middle"></text>
      <text id="hub-bottom" x="160" y="174" text-anchor="middle"></text>
    </svg>
  </div>
  <script src="wheel.js"></script>
</body>
</html>
